
name: Release

on:
  push:
    branches:
      - main
  # Allows re-running migrations, release and deploy by hand, so a redeploy
  # does not require an empty commit.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a running prod deploy.
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # A red suite on main stops here: `ci` must pass before migrations run, so a
  # failing `checks` or `e2e` job blocks the migration and the deploy below.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # No secrets are needed by ci.yml today; inherit keeps this future-proof.
    secrets: inherit

  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run Migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Applies supabase/config.toml (with the [remotes.production] overrides)
      # to the hosted project — config.toml is the source of truth for auth
      # settings; dashboard edits to sections it defines will be overwritten.
      - name: Push Config
        run: supabase config push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: migrate
    outputs:
      # SHA of the commit to deploy: the semantic-release version bump when a
      # release was cut, otherwise the pushed commit itself.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run semantic-release
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: release
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Deploy the released commit so the shipped build carries the bumped
      # version, not the pre-release one.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Vercel CLI
        run: npm install --global vercel@59.10.0

      # Source is uploaded and built by Vercel, so the build sees every project
      # env var (including ones marked Sensitive, which `vercel pull` cannot
      # read) and reuses Vercel's remote build cache. Blocks until ready, so a
      # failed build fails this job.
      - name: Deploy
        run: |
          url=$(vercel deploy --prod --yes)
          echo "Deployed to $url"
          echo "### Deployed to [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
